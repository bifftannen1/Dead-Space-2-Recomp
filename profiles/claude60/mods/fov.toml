# FOV change: scales the vertical field of view of the game's 3D render contexts.
[mod]
name = "fov"
version = "1.0.0"
description = "Scale the field of view (settings.fov_scale)"
enabled = false
load_order = 10
sources = ["fov/fov.cpp"]
hooks = ["RenderContext::RC_RebuildAndApplyProjectionMatrix"]

[settings]
fov_scale = 1.0   # 1.0 = unchanged; > 1 wider, < 1 narrower
log_calls = 5      # log the first N projections (then powers of two)
